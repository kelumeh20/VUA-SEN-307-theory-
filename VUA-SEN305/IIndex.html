
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Bio Data Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #1d4ed8;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #1d4ed8;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1e40af;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Student Bio Data Form</h2>

        <form id="bioForm">

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname"
                   placeholder="Enter your full name" required>

            <label for="matric">Matric Number:</label>
            <input type="text" id="matric" name="matric"
                   placeholder="Enter your matric number" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>

            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>

            <label for="department">Department:</label>
            <input type="text" id="department" name="department"
                   placeholder="Enter your department" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="e.g. 08012345678" required>

            <button type="submit">Submit Bio Data</button>

            <p id="message"></p>

        </form>
    </div>

    <script>
        const form = document.getElementById("bioForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const fullname = document.getElementById("fullname").value.trim();
            const matric = document.getElementById("matric").value.trim();
            const email = document.getElementById("email").value.trim();
            const dob = document.getElementById("dob").value;
            const gender = document.getElementById("gender").value;
            const department = document.getElementById("department").value.trim();
            const phone = document.getElementById("phone").value.trim();

            if (fullname.length < 3) {
                message.style.color = "red";
                message.textContent = "Please enter your full name.";
                return;
            }

            if (matric.length < 3) {
                message.style.color = "red";
                message.textContent = "Please enter a valid matric number.";
                return;
            }

            if (!dob || new Date(dob) >= new Date()) {
                message.style.color = "red";
                message.textContent = "Please enter a valid date of birth.";
                return;
            }

            if (!/^\d{11}$/.test(phone)) {
                message.style.color = "red";
                message.textContent = "Phone number must contain exactly 11 digits.";
                return;
            }

            if (!department) {
                message.style.color = "red";
                message.textContent = "Please enter your department.";
                return;
            }

            message.style.color = "green";
            message.textContent = "Bio data submitted successfully!";

            console.log({
                fullname,
                matric,
                email,
                dob,
                gender,
                department,
                phone
            });

            form.reset();
        });
    </script>

</body>
</html>
